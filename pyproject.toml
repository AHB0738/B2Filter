[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b2filter"
version = "1.0.0"
description = "A reproducible, command-line and Python toolkit for variant prioritization in non-obstructive azoospermia research."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Abdelhafedh BEN DAHMANE"}]
keywords = ["bioinformatics", "genetics", "variant-prioritization", "azoospermia", "NGS"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent"
]
dependencies = [
  "pandas>=1.5",
  "openpyxl>=3.1",
  "requests>=2.28"
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "twine>=5"]

[project.scripts]
b2filter = "B2Filter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
